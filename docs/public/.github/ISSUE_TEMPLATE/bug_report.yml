name: Bug report
description: Report a reproducible problem in the simulator.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Open the app
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.0.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 / Windows 11 23H2
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Attach screenshots, error dialogs, or relevant log lines.
